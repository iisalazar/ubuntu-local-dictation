<!DOCTYPE html>
<html>
<head>
  <title>Local Dictation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    header {
      padding: 16px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #aaa;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      transition: background 0.2s;
    }

    .status-dot.ready { background: #4caf50; }
    .status-dot.recording { background: #f44336; }
    .status-dot.transcribing { background: #ff9800; }

    .badges {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #0f3460;
      color: #8ab4f8;
      font-family: monospace;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #log:empty::after {
      content: 'Transcriptions will appear here.\APress your hotkey to start recording.';
      white-space: pre-wrap;
      color: #555;
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
    }

    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px 16px;
      position: relative;
    }

    .card.error {
      border-color: #5c2020;
      background: #2a1a1a;
    }

    .card-time {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }

    .card-text {
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
      user-select: text;
    }

    .card.error .card-text {
      color: #f44336;
    }

    .card-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #0f3460;
      border: none;
      color: #8ab4f8;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .card-copy:hover {
      background: #1a4a8a;
    }

    #log::-webkit-scrollbar {
      width: 6px;
    }

    #log::-webkit-scrollbar-track {
      background: transparent;
    }

    #log::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 100;
      text-align: center;
      max-width: 360px;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="app-title">Local Dictation</span>
      <div class="status">
        <span class="status-dot ready" id="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>
    <div class="badges">
      <span class="badge" id="hotkey-badge">...</span>
      <span class="badge" id="mode-badge">...</span>
    </div>
  </header>
  <div id="log"></div>
  <div class="toast" id="toast"></div>

<script>
const { ipcRenderer, clipboard } = require('electron');

const log = document.getElementById('log');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const hotkeyBadge = document.getElementById('hotkey-badge');
const modeBadge = document.getElementById('mode-badge');

// ── UI IPC ──────────────────────────────────────────────────────────

ipcRenderer.on('config', (_e, config) => {
  hotkeyBadge.textContent = config.hotkey || 'Super+Shift+D';
  modeBadge.textContent = config.mode;
});

ipcRenderer.on('status-change', (_e, status) => {
  statusDot.className = 'status-dot ' + status;
  const labels = { ready: 'Ready', recording: 'Recording...', transcribing: 'Transcribing...' };
  statusText.textContent = labels[status] || status;
});

ipcRenderer.on('transcription-text', (_e, text) => {
  addCard(text, false);
  showToast('Transcription complete — text pasted. Click Copy on the card to copy again.');
});

ipcRenderer.on('transcription-error', (_e, msg) => {
  addCard(msg, true);
});

function addCard(text, isError) {
  const card = document.createElement('div');
  card.className = 'card' + (isError ? ' error' : '');

  const time = document.createElement('div');
  time.className = 'card-time';
  time.textContent = new Date().toLocaleTimeString();

  const body = document.createElement('div');
  body.className = 'card-text';
  body.textContent = text;

  card.appendChild(time);
  card.appendChild(body);

  if (!isError) {
    const btn = document.createElement('button');
    btn.className = 'card-copy';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      clipboard.writeText(text);
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    });
    card.appendChild(btn);
  }

  log.appendChild(card);
  log.scrollTop = log.scrollHeight;
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('visible'); }, 3000);
}

// ── Audio Capture ───────────────────────────────────────────────────

let mediaRecorder = null;
let audioChunks = [];

ipcRenderer.on('start-recording', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        sampleRate: 16000,
        channelCount: 1,
        echoCancellation: false,
        noiseSuppression: false,
      }
    });

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });

      // Decode to 16kHz float32 PCM for Whisper
      const arrayBuffer = await blob.arrayBuffer();
      const audioContext = new AudioContext({ sampleRate: 16000 });
      try {
        const audioData = await audioContext.decodeAudioData(arrayBuffer);
        const float32 = audioData.getChannelData(0);
        // Send as regular array (IPC can't handle Float32Array directly)
        ipcRenderer.send('audio-pcm', Array.from(float32));
      } catch (err) {
        console.error('Audio decode error:', err);
        ipcRenderer.send('transcription-error', 'Failed to decode audio: ' + err.message);
      } finally {
        audioContext.close();
      }
    };

    mediaRecorder.start(100);
    console.log('Recording started');
  } catch (err) {
    console.error('Mic access error:', err);
    ipcRenderer.send('transcription-error', 'Mic error: ' + err.message);
  }
});

ipcRenderer.on('stop-recording', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    console.log('Recording stopped');
  }
});
</script>
</body>
</html>
